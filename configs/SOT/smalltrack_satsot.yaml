# SmallTrack (TGRS 2023) evaluation on SatSOT — single-object tracking, HBB.
# Third-party PyTorch re-implementation (xyl-507/SmallTrack),
# LaTOT-trained weights (smallest-target variant) — see models/smalltrack.py for the footnote this requires.
# Set CHECKPOINT_ROOT to the local checkpoint directory before running.
# Usage: CHECKPOINT_ROOT=... python evaluation/eval_smalltrack.py --config configs/SOT/smalltrack_satsot.yaml

dataset: SatSOT
dataset_root: /data/ESA_DLSTEM_2025/data/trafic/SatSOT
class_map:
  car: 0
  plane: 1
  ship: 2
  train: 3

eval_mode: sot
img_size: null

variant: r50_l234_latot
yaml_path: configs/SOT/smalltrack_r50_l234_latot.yaml
ckpt_path: ${CHECKPOINT_ROOT}/smalltrack/SmallTrack-LaTOT.pth

prompt_strategy: first_frame
prompt_interval: 10

clip_len: 32
clip_stride: 1
batch_size: 1
num_workers: 0

iou_thresh: 0.3
score_thresh: 0.5
max_wandb_images: 50

wandb_project: esa-dlstem
wandb_entity: anonymous
