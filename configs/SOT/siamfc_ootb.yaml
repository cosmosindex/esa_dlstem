# SiamFC (ECCV 2016 workshops) evaluation on OOTB — single-object tracking, HBB.
# Third-party PyTorch re-implementation (huanglianghua/siamfc-pytorch),
# GOT-10k-trained weights — see models/siamfc.py for the footnote this requires.
# Set CHECKPOINT_ROOT to the local checkpoint directory before running.
# Usage: CHECKPOINT_ROOT=... python evaluation/eval_siamfc.py --config configs/SOT/siamfc_ootb.yaml

dataset: OOTB
dataset_root: ${DATA_ROOT}/data/trafic/OOTB
class_map:
  car: 0
  plane: 1
  ship: 2
  train: 3

eval_mode: sot
obb_eval_mode: ootb_aabb
img_size: null

variant: alexnet_e50
ckpt_path: ${CHECKPOINT_ROOT}/siamfc/siamfc_alexnet_e50.pth

prompt_strategy: first_frame
prompt_interval: 10

clip_len: 32
clip_stride: 1
batch_size: 1
num_workers: 0

iou_thresh: 0.3
score_thresh: 0.5
max_wandb_images: 50

wandb_project: esa-dlstem
wandb_entity: anonymous
