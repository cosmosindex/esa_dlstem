# TGraM on the released Space-Tracker-MOT NON-CAR test split.
# Model: the non-car retrain (2026-08-24), NOT the earlier union model — that
# one was trained on a union split which overlapped 60% of this test set.
dataset: space_tracker_nocar
checkpoint: ${REPO_ROOT}/TGraM/exp/mot/tgram_space_tracker_nocar/model_best.pth
arch: tgrammbseg
num_classes: 2              # checkpoint hm head is 2-channel (airplane, ship)
conf_thres: 0.4
track_buffer: 30
frame_rate: 30
K: 500
min_box_area: 0.0
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.3
