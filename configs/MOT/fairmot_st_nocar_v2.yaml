# FairMOT on the released Space-Tracker-MOT NON-CAR test split.
# Model: the 2026-08-27 v2 retrain. TWO classes, not three: the JDE export
# dropped the unusable `train` class (752 boxes, 1 sequence, absent from val),
# so labels carry only class 0/1 and the v1 3-channel head had a dead channel.
# Evaluating this checkpoint against num_classes: 3 silently leaves hm.2 randomly
# initialised -- it does not error, it just returns noise.
dataset: spacetracker_nocar
checkpoint: /work/anon/checkpoints/fairmot_st_nocar_v2_best.pth
arch: hrnet_18
num_classes: 2              # checkpoint hm head is 2-channel (airplane, ship)
conf_thres: 0.4
track_buffer: 30
frame_rate: 30
K: 500
min_box_area: 0.0
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.3
