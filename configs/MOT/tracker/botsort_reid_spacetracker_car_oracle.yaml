# botsort_reid on the Space-Tracker-MOT car test split, GT-BOX ORACLE.
# Detections are ground truth at score 1.0, so every score-dependent threshold
# below (track_high/low, new_track, appearance gating by score) is inert by
# construction. They are left in place, not deleted, so this file diffs against
# botsort_reid_spacetracker_car.yaml in exactly one line: the cache.
dataset: spacetracker_car
tracker: botsort_reid
cache_dir: /data/ESA_DLSTEM_2025/experiments/Detection/gt_car_feats_cache
score_floor: 0.0            # oracle: every box scores 1.0, so any floor is inert
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  feat_dim: 2048
  track_high_thresh: 0.30
  track_low_thresh: 0.10
  new_track_thresh: 0.35
  track_buffer: 30
  match_thresh: 0.9        # cost limit on (1-IoU): 0.9 == accept IoU>=0.1,
                           # matching sort/ocsort. The MOT17 default 0.5 demands
                           # IoU>=0.5, unreachable between few-pixel car boxes.
  proximity_thresh: 0.5
  appearance_thresh: 0.25
  cmc_method: none
  mot20: false
  frame_rate: 30
