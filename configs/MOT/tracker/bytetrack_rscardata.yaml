# ByteTrack on RsCarData (HiEUM cached dets).
dataset: rscardata
tracker: bytetrack
cache_dir: ${DATA_ROOT}/experiments/Detection/hieum_dets_cache/rscardata
score_floor: 0.10                # let ByteTrack's two-stage rescue use 0.10–track_thresh
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  track_thresh: 0.30             # high-conf threshold; HiEUM scores cluster 0.3–0.5
  track_buffer: 30
  match_thresh: 0.5              # 1 - IoU; cars are tiny so IoU acceptance is loose
  mot20: false
  # ByteTrack/BoT-SORT scale track_buffer by this. Left at the upstream
  # default rather than each sequence's true rate (10, 8 or 6 fps, now
  # published per sequence in the release): every number in the paper was
  # produced with it, and the buffer is long enough at 30 that lowering it
  # would only shorten track memory.
  frame_rate: 30
