# botsort_reid on spacetracker_nocar (Space-Tracker-MOT non-car). FasterRCNN cached dets + FastReID feats, multi-class.
# Driver: eval_tracker_multiclass_reid.py (per-class tracker instance with appearance feats).
dataset: spacetracker_car
tracker: botsort_reid
cache_dir: ${DATA_ROOT}/experiments/Detection/spacetracker_car_feats_cache
score_floor: 0.26
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  feat_dim: 2048
  track_high_thresh: 0.30
  track_low_thresh: 0.10
  new_track_thresh: 0.35
  track_buffer: 30
  match_thresh: 0.9        # cost limit on (1-IoU): 0.9 == accept IoU>=0.1,
                           # matching sort/ocsort. The MOT17 default 0.5 demands
                           # IoU>=0.5, unreachable between few-pixel car boxes.
  proximity_thresh: 0.5
  appearance_thresh: 0.25
  cmc_method: none
  mot20: false
  # ByteTrack/BoT-SORT scale track_buffer by this. Left at the upstream
  # default rather than each sequence's true rate (10, 8 or 6 fps, now
  # published per sequence in the release): every number in the paper was
  # produced with it, and the buffer is long enough at 30 that lowering it
  # would only shorten track memory.
  frame_rate: 30
