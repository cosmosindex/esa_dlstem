# SORT on space_tracker_nocar (Space-Tracker-MOT non-car). FasterRCNN cached dets, multi-class.
# Driver: eval_tracker_multiclass.py (per-class tracker instance).
dataset: space_tracker_nocar
tracker: sort
cache_dir: ${DATA_ROOT}/experiments/Detection/space_tracker_nocar_dets_cache/space_tracker_nocar
score_floor: 0.25
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  max_age: 5
  min_hits: 1
  iou_threshold: 0.1
  score_thresh: 0.0
