# botsort on space_tracker_car (Space-Tracker-MOT car). HiEUM cached dets, single class.
# score_floor 0.26 = HiEUM's F1-optimal operating point. NOT the 0.25 used for
# non-car: HiEUM's scores top out at 0.66, so a threshold tuned for Faster R-CNN
# would discard almost everything (0.5 leaves 0.5% of detections).
dataset: space_tracker_car
tracker: botsort
cache_dir: ${DATA_ROOT}/experiments/Detection/hieum_dets_cache_st_best/space_tracker_car
score_floor: 0.26
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  track_high_thresh: 0.268  # quantile-matched to FRCNN's 0.30
  track_low_thresh: 0.110   # quantile-matched to FRCNN's 0.10
  new_track_thresh: 0.274   # quantile-matched to FRCNN's 0.35
  track_buffer: 30
  match_thresh: 0.9        # cost limit on (1-IoU): 0.9 == accept IoU>=0.1,
                           # matching sort/ocsort. The MOT17 default 0.5 demands
                           # IoU>=0.5, unreachable between few-pixel car boxes.
  cmc_method: none
  mot20: false
  # ByteTrack/BoT-SORT scale track_buffer by this. Left at the upstream
  # default rather than each sequence's true rate (10, 8 or 6 fps, now
  # published per sequence in the release): every number in the paper was
  # produced with it, and the buffer is long enough at 30 that lowering it
  # would only shorten track memory.
  frame_rate: 30
