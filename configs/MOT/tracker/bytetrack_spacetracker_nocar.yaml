# BYTETRACK on spacetracker_nocar (Space-Tracker-MOT non-car). FasterRCNN cached dets, multi-class.
# Driver: eval_tracker_multiclass.py (per-class tracker instance).
dataset: spacetracker_nocar
tracker: bytetrack
cache_dir: ${DATA_ROOT}/experiments/Detection/spacetracker_nocar_dets_cache/spacetracker_nocar
score_floor: 0.10
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.5
tracker_kwargs:
  track_thresh: 0.30
  track_buffer: 30
  match_thresh: 0.5
  mot20: false
  frame_rate: 30
