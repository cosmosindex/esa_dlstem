# TGraM on the released Space-Tracker-MOT NON-CAR test split.
# Model: the 2026-08-27 v2 retrain (mini-epoch 11, val det_loss 1.874), which
# unlike v1 starts from ImageNet weights -- see tgram_mbseg.py::load_imagenet_backbone.
dataset: spacetracker_nocar
checkpoint: /work/anon/checkpoints/tgram_st_nocar_v2_best.pth
arch: tgrammbseg
num_classes: 2              # checkpoint hm head is 2-channel (airplane, ship)
conf_thres: 0.4
track_buffer: 30
frame_rate: 30
K: 500
min_box_area: 0.0
match_metric: centroid
centroid_dist_thresh: 5.0
iou_thresh: 0.3
